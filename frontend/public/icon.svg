<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <circle cx="256" cy="256" r="200" fill="url(#roseGrad)" opacity="0.15" filter="url(#glow)" />
  <!-- Heart Icon inside -->
  <path d="M256 420 C256 420 80 290 80 180 C80 120 125 80 180 80 C216 80 244 100 256 122 C268 100 296 80 332 80 C387 80 432 120 432 180 C432 290 256 420 256 420 Z" fill="url(#roseGrad)" />
  <!-- Text N letter in center -->
  <text x="256" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="140" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">N</text>
</svg>